# ============================================================
# MatrixFlow Enterprise
# Configuración de Alembic
# ============================================================

[alembic]

# Carpeta donde se encuentran env.py y versions/.
script_location = alembic

# Permite importar el paquete app desde la carpeta backend.
prepend_sys_path = .

# Separador utilizado para rutas.
path_separator = os


# ============================================================
# LOGGING
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S